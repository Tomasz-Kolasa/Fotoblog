    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response body has correct structure and values\", function () {\r

      \    pm.response.to.have.jsonBody({\r

      \        \"errorCode\": null,\r

      \        \"status\": true\r

      \    });\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: ""
    language: text/javascript
