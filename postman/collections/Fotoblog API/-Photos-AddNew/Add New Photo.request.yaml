$kind: http-request
url: "{{baseUrl}}/Photos/AddNew"
method: POST
headers:
  Authorization: Bearer {{jwtToken}}
body:
  type: formdata
  content:
    - type: file
      key: File
      src:
        - postman/data/photos/1.jpg
      description: ""
      disabled: false
    - type: text
      key: Title
      value: "{{photoTitle}}"
      description: ""
      disabled: false
    - type: text
      key: Description
      value: "{{photoDescription}}"
      description: ""
      disabled: false
auth:
  type: noauth
