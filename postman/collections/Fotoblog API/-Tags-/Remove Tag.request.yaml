$kind: http-request
url: "{{baseUrl}}/Tags/Remove/{{testTagId}}"
method: DELETE
headers:
  Authorization: Bearer {{jwtToken}}
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type is application/json", function () {
          pm.response.to.have.header("Content-Type");
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      const jsonData = pm.response.json();

      pm.test("Response has expected structure", function () {
          pm.expect(jsonData).to.have.property("errorCode");
          pm.expect(jsonData).to.have.property("status");
      });

      pm.test("Tag removed successfully", function () {
          pm.expect(jsonData.errorCode).to.be.null;
          pm.expect(jsonData.status).to.be.true;
      });

      pm.test("Tag endpoint related variables are cleared from collection variables", function () {
          pm.collectionVariables.unset("testTagId");
          pm.collectionVariables.unset("testTagName");
          pm.collectionVariables.unset("testTagUpdated");
          pm.expect(pm.collectionVariables.get("testTagId")).to.be.undefined;
          pm.expect(pm.collectionVariables.get("testTagName")).to.be.undefined;
          pm.expect(pm.collectionVariables.get("testTagUpdated")).to.be.undefined;
      });
    language: text/javascript
  - type: beforeRequest
    code: |-
      const tagId = pm.collectionVariables.get("testTagId");
      if (!tagId) {
          pm.execution.skipRequest();
      }
    language: text/javascript
order: 4000
