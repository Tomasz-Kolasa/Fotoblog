$kind: http-request
url: "{{baseUrl}}/Auth/Login"
method: POST
body:
  type: json
  content: '{"password":"wrongPassword","userName":{{validUsername}}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 1000
