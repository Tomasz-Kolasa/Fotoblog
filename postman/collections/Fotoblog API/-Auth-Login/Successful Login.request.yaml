$kind: http-request
url: "{{baseUrl}}/Auth/Login"
method: POST
body:
  type: json
  content: '{"password":"{{validPwd}}","userName":"{{validUsername}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response content-type is application/json", function () {
          pm.response.to.have.header("Content-Type");
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      const jsonData = pm.response.json();

      pm.test("Response body has expected structure", function () {
          pm.expect(jsonData).to.have.property("errorCode");
          pm.expect(jsonData).to.have.property("status");
          pm.expect(jsonData).to.have.property("data");
      });

      pm.test("JWT Token received", function () {
          pm.expect(jsonData.errorCode).to.be.null;
          pm.expect(jsonData.status).to.be.true;
          pm.expect(jsonData.data).to.be.a("string");

          pm.collectionVariables.set("jwtToken", jsonData.data);
      });
    language: text/javascript
order: 3000
