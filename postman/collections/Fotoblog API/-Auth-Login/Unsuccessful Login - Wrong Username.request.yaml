$kind: http-request
url: "{{baseUrl}}/Auth/Login"
method: POST
body:
  type: json
  content: '{"password":"{{validPwd}}","userName":"{{userName}}"}'
scripts:
  - type: afterResponse
    code: "const iterData = pm.variables.get(\"iterData\");\r

      \r

      pm.test(`Response code is ${iterData.responseData.httpResponseCode}`, function () {\r

      \    pm.expect(pm.response.code).to.be.eql(iterData.responseData.httpResponseCode);\r

      });\r

      \r

      pm.test(\"Response content-type is application/json\", function () {\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      });\r

      \r

      const jsonData = pm.response.json();\r

      \r

      pm.test(\"Response body has expected structure\", function () {\r

      \    pm.expect(jsonData).to.have.property(\"errorCode\");\r

      \    pm.expect(jsonData).to.have.property(\"status\");\r

      \    pm.expect(jsonData).to.have.property(\"data\");\r

      });\r

      \r

      pm.test(\"JWT Token not received\", function () {\r

      \    pm.expect(jsonData.errorCode).to.eql(iterData.responseData.errorCode);\r

      \    pm.expect(jsonData.status).to.be.eql(iterData.responseData.status);\r

      \    pm.expect(jsonData.data).to.be.null;\r

      });"
    language: text/javascript
  - type: beforeRequest
    code: "pm.variables.set(\"iterData\", pm.iterationData.get(\"Login_Endpoint\").WrongUserName_Request);\r

      \r

      pm.variables.set(\"userName\",pm.iterationData.get(\"Login_Endpoint\").WrongUserName_Request.requestData.userName); // used in request body\r\n"
    language: text/javascript
order: 2000
